# ---- TAGS -----
windowrule = tag +transient, class:(?i)(confirm|dialog|download|notification|error|splash|confirmreset)

# ----- Workspace Specific Windows -----
windowrule = workspace 1, class:footclient
windowrule = workspace 2, class:(?i)(LibreWolf|zen|Brave-browser)
windowrule = workspace 3, class:codium-url-handler
windowrule = workspace 4, class:(?i)(thunderbird|whatstux|Pidgin|org.telegram.desktop)
windowrule = workspace 5, title:Spotify Free, class:(?i)(io.bassi.Amberol|Spotify)
windowrule = workspace 6, class:com.obsproject.Studio
windowrule = workspace 7, class:(?i)(WebCord|de.shorsh.discord-screenaudio|vesktop)
windowrule = workspace 8, class:mpv
windowrule = workspace 9, class:org.pwmt.zathura

# ----- Window Rules -----
windowrule = float, class:^(org.telegram.desktop)
windowrule = size 506 811, class:(org.telegram.desktop)
windowrule = move 707 155, class:(org.telegram.desktop)
windowrule = float, class:^(io.bassi.Amberol)
windowrule = move 718 223, class:(io.bassi.Amberol)
windowrule = size 461 665, class:(io.bassi.Amberol)
windowrule = opacity 0.6, class:(io.bassi.Amberol)
windowrule = size 588 220, title:emacs-run-launcher
windowrule = move 613 404, title:emacs-run-launcher
windowrule = move center, title:(.*[Oo]pen.*)

# ----- Floating Windows -----
windowrule = float, tag:transient
windowrule = float, title:(.*[Oo]pen.*)
windowrule = float, title:Confirm to replace files
windowrule = float, title:Steam Settings
windowrule = float, class:file_progress
windowrule = float, title:File Operation Progress
windowrule = float, title:emacs-run-launcher
windowrule = float, title:branchdialog
windowrule = float, class:Lxappearance
windowrule = float, class:org.qbittorrent.qBittorrent
windowrule = float, class:(?i)viewnior

# Optional File Chooser and Image Previews
windowrule = size 808 450, title:Choose Files
windowrule = float, title:.*tmp\.(png|jpg).*
windowrule = move 837 400, title:.*tmp\.(png|jpg).*
windowrule = size 235 235, title:.*tmp\.(png|jpg).*

# pavucontrol
windowrule = float, class:.*pavucontrol.*
windowrule = move center, class:.*pavucontrol.*
windowrule = size 973 522, class:.*pavucontrol.*

# showmethekey tweaks
windowrule = float, class:showmethekey-gtk
windowrule = pin, class:showmethekey-gtk
windowrule = move 2 935, title:^(Floating Window - Show Me The Key)
windowrule = size 1916 122, title:^(Floating Window - Show Me The Key)  

# Rofi polish
windowrule = float, class:Rofi
windowrule = animation none, class:Rofi
windowrule = rounding 5, class:Rofi
 
# Misc
windowrule = animation popin, class:thunar
windowrule = rounding 4, tag:transient
windowrule = animation popin, tag:transient
windowrule = noblur, class:ulauncher

# ----- Layer Rules ------

layerrule = blur, swaync-control-center
layerrule = blur, waybar
layerrule = blur, swaync-notification-window
layerrule = ignorezero, waybar
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha, swaync-control-center
layerrule = ignorealpha, waybar
layerrule = ignorealpha, swaync-notification-window


